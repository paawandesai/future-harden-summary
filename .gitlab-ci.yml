# CI for weekly-summary. The local hooks (.pre-commit-config.yaml) catch most problems before a push;
# this pipeline re-runs every required merge check (lint, typecheck, test, build) so nothing depends on hooks.
#
# Runner: w2-ci-runner, Docker executor, unprivileged, local cache only (no shared cache server).
# Budget per job: 2 vCPU / 2 GB. Concurrency: 2 jobs for this project.

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages:
  - verify
  - scheduled

variables:
  GIT_DEPTH: "20"
  # No Husky in this repo; kept so a future Node toolchain never installs hooks in CI.
  # CI never installs the pre-commit hooks either: they live in the dev group, which no job installs.
  HUSKY: "0"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fast"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_FROZEN: "1" # install exactly uv.lock; fail if it is out of date
  UV_PYTHON_DOWNLOADS: "never" # the image ships Python 3.14
  UV_NO_PROGRESS: "1"
  # uv sees the host's CPU count inside the container; hold it to the job's 2 vCPU.
  UV_CONCURRENT_INSTALLS: "2"
  UV_CONCURRENT_BUILDS: "2"
  UV_CONCURRENT_DOWNLOADS: "8"

default:
  # uv + Python 3.14 in one slim image, pinned by digest. It already is the prebuilt tool image,
  # so there is no Dockerfile.ci (see the MR description).
  image: ghcr.io/astral-sh/uv:0.11.32-python3.14-trixie-slim@sha256:c2971e36c3f826c5d0c59f009ecc5c2c5e90fe2ad2087d258b711cb7a453697f
  interruptible: true
  timeout: 15m

# Python sources and anything that changes how they are checked.
.python-changes: &python-changes
  - "**/*.py"
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml

# main and schedules always run everything; other branches and MRs skip when no Python input changed.
.verify-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - changes:
        paths: *python-changes
        compare_to: refs/heads/main

# uv's download cache, one per dependency group, keyed on the lockfile. Each job re-syncs its own .venv
# from it (well under a second warm) instead of passing a venv between jobs as an artifact.
.uv-cache: &uv-cache
  key:
    files: [uv.lock]
    prefix: uv-$CI_JOB_NAME
  paths: [.cache/uv]

typecheck:
  stage: verify
  needs: []
  extends: .verify-rules
  variables:
    NODE_OPTIONS: "--max-old-space-size=1536" # pyright runs on Node; cap the heap at ~75% of 2 GB
  cache: *uv-cache
  script:
    - uv run --no-default-groups --group typecheck --group test pyright

test:
  stage: verify
  needs: []
  extends: .verify-rules
  cache: *uv-cache
  # One process: the suite takes ~2 s, so pytest-xdist workers would cost more than they save.
  script:
    - uv run --no-default-groups --group test pytest -q -p no:cacheprovider --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml

lint:
  stage: verify
  needs: []
  extends: .verify-rules
  cache: *uv-cache
  script:
    - uv run --only-group lint ruff check .
    - uv run --only-group lint ruff format --check .

build:
  stage: verify
  needs: []
  extends: .verify-rules
  cache: *uv-cache
  script:
    - uv build
  artifacts:
    expire_in: 1 day
    paths: [dist/]

# Off the push path: runs on the scheduled pipeline, or by hand from an MR. Heavy lane.
dependency-audit:
  stage: scheduled
  needs: []
  tags: [heavy]
  cache:
    <<: *uv-cache
    paths: [.cache/uv, .cache/uv-tools]
  variables:
    UV_TOOL_DIR: "$CI_PROJECT_DIR/.cache/uv-tools"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - uv export --all-groups --no-emit-project --format requirements.txt -o requirements-audit.txt
    - uvx --from pip-audit==2.9.0 pip-audit -r requirements-audit.txt --require-hashes --disable-pip
