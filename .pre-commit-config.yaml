# Local feedback loop. Install once per clone:  uv sync && uv run pre-commit install
# pre-commit (<10 s): staged files only. pre-push (<60 s): whole-repo typecheck and the full unit suite.
# Hooks run the versions pinned in uv.lock through `uv run --frozen`, so they match CI and need no network.
# CI does not run these hooks; it runs the same commands directly (see .gitlab-ci.yml).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --only-group lint ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --frozen --only-group lint ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: pyright
        name: pyright (whole repo)
        entry: uv run --frozen pyright
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pytest
        name: pytest (full unit suite)
        entry: uv run --frozen pytest -q -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
