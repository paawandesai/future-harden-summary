[project]
name = "weekly-summary"
version = "0.1.0"
description = "Weekly progress summaries for fitness members, drafted by an LLM and approved by a coach."
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "pydantic>=2.7",
]

[project.scripts]
weekly-summary = "weekly_summary.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "pyright>=1.1.400"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.14"
include = ["weekly_summary", "tests"]
