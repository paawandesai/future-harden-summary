[project]
name = "weekly-summary"
version = "0.1.0"
description = "Weekly progress summaries for fitness members, drafted by an LLM and approved by a coach."
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "pydantic>=2.7",
]

[project.scripts]
weekly-summary = "weekly_summary.__main__:main"

# Split by CI job so each job installs only what it runs. `uv sync` (the dev group) installs all of them.
# pyright[nodejs] takes Node from a locked wheel; the Node pyright downloads by default fails in slim images.
[dependency-groups]
lint = ["ruff>=0.14"]
test = ["pytest>=8"]
typecheck = ["pyright[nodejs]>=1.1.400"]
dev = [
    "pre-commit>=4",
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package only. Future's guidebook, the traces, labels and results stay in the repo, out of any artifact.
[tool.hatch.build.targets.sdist]
include = ["weekly_summary", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.14"
include = ["weekly_summary", "tests"]
